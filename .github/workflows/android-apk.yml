name: 🤖 Bahnpilot APK Bauen

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Code holen
        uses: actions/checkout@v4

      - name: ☕ Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 📦 Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🤖 Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: 📦 Dependencies installieren
        run: npm ci

      - name: 🏗 Android Projekt erstellen
        run: |
          npm run sync:www
          npx cap add android || echo "Android platform exists, syncing..."
          npm run cap:sync

      - name: 🔨 Debug APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info

      - name: 📲 APK umbenennen
        run: |
          cd android/app/build/outputs/apk/debug
          mv app-debug.apk bahnpilot-debug-${{ github.sha }}.apk
          ls -lh *.apk

      - name: 📤 APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: bahnpilot-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          compression-level: 0

      # Optional: Release APK (signiert) - benötigt Secrets
      # Wenn ihr ANDROID_KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD in Secrets hinterlegt,
      # wird hier automatisch ein signiertes Release gebaut:
      - name: 🔐 Keystore wiederherstellen (nur wenn Secrets vorhanden)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/bahnpilot.keystore
          echo "storeFile=bahnpilot.keystore" >> android/gradle.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/gradle.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/gradle.properties

      - name: 🚀 Release APK bauen (wenn Keystore vorhanden)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: 📤 Release APK hochladen
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bahnpilot-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: 🎉 Release erstellen (bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
